name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: [solitaire-tui, kilix-lander, joustix, kilix-brokeout, bashed-earth,
               kilix-lights, kilix-jpak, kilix-pong, chess-bash, kilix-rancher,
               kilix-fishtank]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y build-essential
          zlib1g-dev imagemagick python3-pil binutils
      - name: Test ${{ matrix.game }}
        run: make -C ${{ matrix.game }} test
